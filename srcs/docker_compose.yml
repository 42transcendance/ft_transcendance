version: '3.8'

services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    ports:
      - "8443:443"
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - mariadb
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    networks:
      - ft_transcendance
    restart: on-failure

  static-site:
    build:
      context: requirements/bonus/static-site
      dockerfile: Dockerfile
    container_name: static-site
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8080:8080"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  discord-alertmanager:
    image: benjojo/alertmanager-discord
    container_name: discord-alertmanager
    networks:
      - ft_transcendance
    restart: on-failure
    env_file:
      - ../secrets/discord.env

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "9093:9093"
    volumes:
      - ./requirements/bonus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - discord-alertmanager

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "9090:9090"
    volumes:
      - ./requirements/bonus/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./requirements/bonus/prometheus/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      alertmanager:
        condition: service_healthy

  grafana:
    build:
      context: requirements/bonus/grafana
      dockerfile: Dockerfile
    image: grafana
    container_name: grafana
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vault:
    build:
      context: requirements/vault
      dockerfile: Dockerfile
    image: vault
    container_name: vault
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    cap_add:
      - IPC_LOCK
    secrets:
      - db_password
      - db_root_password
      - wp_admin_password
      - wp_user_password
      - vault_unseal_key
      - vault_root_token
      - discord_webhook

networks:
  ft_transcendance:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress
  grafana:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/grafana
  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/vault

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  vault_unseal_key:
    file: ../secrets/vault_unseal_key.txt
  vault_root_token:
    file: ../secrets/vault_root_token.txt
  discord_webhook:
    file: ../secrets/discord_webhook.txt

