version: '3.8'

services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    ports:
      - "443:443"
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    networks:
      - ft_transcendance
    restart: on-failure
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    depends_on:
      - mariadb
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    networks:
      - ft_transcendance
    restart: on-failure

  static-site:
    build:
      context: requirements/bonus/static-site
      dockerfile: Dockerfile
    container_name: static-site
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8080:8080"

  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    networks:
      - ft_transcendance
    restart: on-failure
    depends_on:
      - mariadb

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "9090:9090"
    volumes:
      - ./requirements/bonus/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.1.5
    container_name: grafana
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./requirements/bonus/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./requirements/bonus/grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  ft_transcendance:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbhujoo/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbhujoo/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
