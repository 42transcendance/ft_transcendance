input {
  # Reçoit des logs depuis Filebeat ou tout agent Beats
  beats {
    port => 5044
  }
 
  # Reçoit des logs en TCP (utile pour tester manuellement)
  tcp {
    port => 5000
    codec => json_lines
  }
}
 
filter {
  # Parse les logs de type Apache/Nginx automatiquement
  if [type] == "nginx" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    geoip {
      source => "clientip"
      target => "[geoip]"
    }
  }
 
  # Supprime les champs internes inutiles
  mutate {
    remove_field => ["@version", "host"]
  }
}
 
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
 
  # Affiche les événements dans les logs Logstash (utile pour débugger)
  stdout {
    codec => rubydebug
  }
}