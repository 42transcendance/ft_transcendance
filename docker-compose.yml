services:
  postgres:
    image: docker.io/postgres:15-alpine
    container_name: transcendence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service_mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: transcendence_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence}@postgres:5432/${POSTGRES_DB:-transcendence_db}
      PORT: 3000
    networks:
      - service_mesh
    ports:
      - "3000:3000"

volumes:
  postgres_data:

networks:
  service_mesh:
    driver: bridge
