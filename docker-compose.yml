services:

  postgres:
    image: docker.io/postgres:15-alpine
    container_name: transcendence_db
    restart: unless-stopped
    env_file:
      - ./secrets/postgres.env
      # REMOVE PORTS, ONLY FOR TESTING !!!!!!
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: transcendence_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      PORT: 3000
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: myroot
    networks:
      - frontend
      - backend
      - monitoring
    volumes:
      - ./uploads_storage:/app/storage/uploads


  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    container_name: transcendence_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - backend

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: transcendence_alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    container_name: transcendence_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      - ./secrets/monitoring.env
    environment:
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: https://localhost:9443/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - frontend

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: transcendence_node_exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,z
    networks:
      - monitoring

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: transcendence_postgres_exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://transcendence:transcendence@postgres:5432/transcendence_db?sslmode=disable
    networks:
      - monitoring
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: transcendence_elasticsearch
    restart: unless-stopped
    env_file:
      - ./secrets/monitoring.env
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./monitoring/elk/snapshots:/snapshots
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: transcendence_logstash
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./secrets/monitoring.env
    environment:
      ELASTIC_HOSTS: http://elasticsearch:9200
      ELASTIC_USERNAME: elastic
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./monitoring/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    expose:
      - "5044"
    networks:
      - frontend
      - backend
      - monitoring

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: transcendence_filebeat
    restart: unless-stopped
    depends_on:
      - logstash
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: transcendence_kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./secrets/monitoring.env
    environment:
      SERVER_NAME: kibana
      SERVER_PUBLICBASEURL: https://localhost:9444
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
    networks:
      - monitoring
      - frontend

  elastic-init:
    image: docker.io/curlimages/curl:8.8.0
    container_name: transcendence_elastic_init
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    env_file:
      - ./secrets/monitoring.env
    environment:
      ELASTIC_HOSTS: http://elasticsearch:9200
      ELASTIC_USERNAME: elastic
      KIBANA_URL: http://kibana:5601
    entrypoint: ["/bin/sh", "/scripts/init-elastic.sh"]
    volumes:
      - ./monitoring/elk/init/init-elastic.sh:/scripts/init-elastic.sh:ro
      - ./monitoring/elk/init/dashboard.ndjson:/scripts/dashboard.ndjson:ro
    networks:
      - monitoring


  nginx:
    build:
      context: ./security/nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
      - "8443:443"
      - "9443:9443"
      - "9444:9444"
    env_file:
      - ./secrets/monitoring.env
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vault:
    build:
      context: ./security/vault
      dockerfile: Dockerfile
    container_name: transcendence_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200" #a supprimer lors de la prod pour ne plus acceder au vault
    networks:
      - backend
    volumes:
      - vault_data:/vault/data
      - ./secrets:/secrets:ro

volumes:
  postgres_data:
  uploads_storage:
  vault_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  filebeat_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
