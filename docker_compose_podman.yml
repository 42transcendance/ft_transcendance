
version: '3.8'
 
services:
 
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    security_opt:
      - label=disable
    networks:
      - ft_transcendance
    restart: on-failure
    ports:
      - "8081:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
      - /var/lib/containers:/var/lib/containers:ro
      - /run/user/${PUID}/podman:/var/run/podman:ro
    command:
      - --podman=unix:///var/run/podman/podman.sock
      - --docker=unix://
      - --docker_only=true
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
 
  discord-alertmanager:
    image: docker.io/benjojo/alertmanager-discord
    container_name: discord-alertmanager
    networks:
      - ft_transcendance
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./secrets/discord.env
 
  alertmanager:
    image: docker.io/prom/alertmanager:v0.26.0
    container_name: alertmanager
    networks:
      - ft_transcendance
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9093:9093"
    volumes:
      - ./devops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - discord-alertmanager
 
  prometheus:
    image: docker.io/prom/prometheus:v2.47.0
    container_name: prometheus
    networks:
      - ft_transcendance
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/prometheus/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      alertmanager:
        condition: service_healthy
 
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    networks:
      - ft_transcendance
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./devops/grafana/conf/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./devops/grafana/conf/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./devops/grafana/conf/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./devops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
 
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ft_transcendance
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - ft_transcendance
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure
 
  kibana-init:
    build:
      context: ./devops/kibana
      dockerfile: Dockerfile
    container_name: kibana-init
    environment:
      - KIBANA_URL=http://kibana:5601
    networks:
      - ft_transcendance
    depends_on:
      kibana:
        condition: service_started
    restart: "no"
 
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./devops/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "5000:5000"
    networks:
      - ft_transcendance
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure
 
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    volumes:
      # Podman sur 42 — logs dans /goinfre
      - /goinfre/${USER}/containers/overlay-containers:/var/lib/docker/containers:ro
      - /run/user/${PUID}/podman/podman.sock:/var/run/docker.sock
      - ./devops/filebeat/filebeat_podman.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./devops/filebeat/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - ft_transcendance
    depends_on:
      logstash:
        condition: service_started
    restart: on-failure
 
networks:
  ft_transcendance:
    driver: bridge
 
volumes:
  grafana:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/grafana
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/elasticsearch
 
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
