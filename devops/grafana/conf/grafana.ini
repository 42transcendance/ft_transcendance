[server]
# Protocol (http or https)
protocol = http
http_port = 3000

# The public-facing domain name used to access Grafana from a browser
domain = localhost

# Enforce domain - redirect to correct domain if host header does not match
enforce_domain = false

# Direct access on port 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[security]
# Disable default admin creation on first start
admin_user = admin

# Disable gravatar fetching (privacy)
disable_gravatar = true

# Cookie security
cookie_secure = true
cookie_samesite = strict

# Content security policy
content_security_policy = true

# Strict transport security (HSTS)
strict_transport_security = true
strict_transport_security_max_age_seconds = 86400
strict_transport_security_preload = true
strict_transport_security_subdomains = true

# Disable embedding in iframes (clickjacking protection)
allow_embedding = false

# Brute force login protection
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[users]
# Disable user signup / registration
allow_sign_up = false

# Disable organization creation for new users
allow_org_create = false

# Auto-assign new users to default org
auto_assign_org = true
auto_assign_org_role = Viewer

# Hide user profiles from other users
viewers_can_edit = false

[auth]
# Disable anonymous access
disable_login_form = false

# Login cookie lifetime (in days)
login_cookie_name = grafana_session

# Maximum login attempts before lockout
disable_signout_menu = false

[auth.anonymous]
# Disable anonymous access completely
enabled = false

[log]
mode = console
level = warn

[unified_alerting]
enabled = true
