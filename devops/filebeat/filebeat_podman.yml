filebeat.inputs:
  - type: log
    paths:
      - /var/lib/docker/containers/*/userdata/ctr.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    processors:
      - add_fields:
          target: container
          fields:
            runtime: podman
 
output.logstash:
  hosts: ["logstash:5044"]
 
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
 
